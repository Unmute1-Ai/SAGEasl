name: Core CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  python:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - run: python -m pip install --upgrade pip build
      - run: python -m pip install -e ".[dev]" cryptography
      - name: Build distributable package
        run: python -m build
      - name: Governance and effect-system core tests
        run: |
          pytest -q             sage/tests/test_policy_gate_phase4.py             sage/tests/test_policy_gate_phase5.py             sage/tests/test_effect_system.py             sage/tests/test_federation_crypto.py
